# YouTube Transcriber 配置檔

# 輸出設定
output:
  base_dir: "./output"     # 轉錄檔案輸出目錄
  temp_dir: "./temp"       # 暫存音訊檔案目錄

# Whisper 設定
whisper:
  backend: "cpp"           # openai, cpp, faster-whisper
  model: "large-v3-turbo"  # tiny, base, small, medium, large, large-v3
  language: "auto"         # auto 或語言代碼 (zh, en, ja...)
  cpp_bin: "/opt/homebrew/bin/whisper-cli"
  model_path: "/Users/linchunchiao/Documents/Youtube_Videos/ggml-large-v3-turbo.bin"

# 處理設定
global:
  max_videos_check: 3      # 每個頻道檢查最新 N 部影片
  max_duration: 120        # 最大影片長度（分鐘）
  cookies_file: null       # YouTube cookies 檔案路徑（與 cookies_from_browser 二選一）
  cookies_from_browser: null  # 關閉：避免 macOS 密碼提示，改用智慧延遲

# 頻道列表
# category 欄位對應 prompts/scout/ 下的評分標準，用於內容篩選分析
categories:
  - crypto: 加密貨幣分析
  - macro_finance: 宏觀金融、貴金屬、外匯
  - spiritual_growth: 靈性成長、能量更新
  - remote_viewing: 遙視預測
  - ufo: UFO 現象（官方揭秘、目擊故事、哲學反思）
  - tech_career: 職涯發展、技術趨勢

